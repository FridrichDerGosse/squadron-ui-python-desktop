[project]
name = "squadron-ui-python-desktop"
version = "0.0.0"
description = ""
authors = [
    {name = "LukasKrah", email = "me@nilus.ink"},
    {name = "Nilusink", email = "..."}
]
license = "GPL-3.0"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = "==3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/FridrichDerGosse/squadron-ui-python-desktop"

[tool.ruff]
# https://docs.astral.sh/ruff/
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "missing-trailing-comma",
    "multi-line-summary-first-line", # Conflicts with D213
    "incorrect-blank-line-before-class", # Conflicts with D211
    "docstring-missing-returns", # preview - does not work with restructedText
    "docstring-missing-exception", # preview - does not work with restructedText
    "missing-copyright-notice",
    "collection-literal-concatenation",
    "unnecessary-multiline-docstring",
    "relative-imports",
    "unsorted-dunder-slots",
    "repeated-equality-comparison", # For speed reasons - using a set is slower,
    "if-stmt-min-max", # For speed reasons - using max is slower
    "unsorted-dunder-all",
    "typed-argument-default-in-stub",
    "PTH",
    "if-expr-min-max",
    "redundant-tuple-in-exception-handler", # (Exception,) -> Exception - not good!
    "redundant-open-modes",
    "write-whole-file",
    "read-whole-file",
    "too-many-arguments",
    "docstring-in-stub",
    "literal-membership",
    "any-type",
    "suspicious-non-cryptographic-random-usage",
    "I",
    "magic-value-comparison",
    "open-file-with-context-handler"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable `from __future__ import annotations` imports
future-annotations = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doc tests are all supported.
docstring-code-format = false
docstring-code-line-length = "dynamic"  # adhere to global line length limit

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undefined-local-with-import-star"]

[tool.ruff.lint.pyflakes]
allowed-unused-imports = ["icecream.ic"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.isort]
# https://isort.readthedocs.io/en/latest/configuration/options.html
multi_line_output = 9
py_version = 312
order_by_type = false
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
indent = 4
atomic = true
balanced_wrapping = true
